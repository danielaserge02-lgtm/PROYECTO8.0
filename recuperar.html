<!DOCTYPE html>
<html lang="es">

<head>
<script src="tuk.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recuperar Contraseña</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Times New Roman",serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#52c6f4;
}

.telefono{
width:330px;
height:700px;
background:#c8e9f8;
border-radius:30px;
position:relative;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

/* Ondas */

.telefono::before{
content:"";
position:absolute;
width:450px;
height:450px;
border:4px solid white;
border-radius:50%;
left:-270px;
top:-50px;
}

.telefono::after{
content:"";
position:absolute;
width:480px;
height:480px;
border:4px solid white;
border-radius:50%;
right:-300px;
bottom:-180px;
}

.onda1{
position:absolute;
width:380px;
height:380px;
border:4px solid #2cb5e8;
border-radius:50%;
left:-260px;
top:170px;
}

.onda2{
position:absolute;
width:360px;
height:360px;
border:4px solid #2cb5e8;
border-radius:50%;
right:-240px;
top:-40px;
}

.contenido{
position:relative;
z-index:2;
padding:25px;
}

h1{
text-align:center;
font-size:34px;
margin-top:20px;
margin-bottom:40px;
}

p{
text-align:center;
font-size:18px;
margin-bottom:30px;
}

label{
display:block;
margin-bottom:5px;
font-size:16px;
}

input{
width:100%;
padding:10px;
margin-bottom:25px;
border:none;
border-radius:15px;
background:#d9d9d9;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:12px;
margin-top:20px;
border:none;
background:#d9d9d9;
font-size:20px;
cursor:pointer;
border-radius:5px;
transition:.3s;
}

button:hover{
background:#bdbdbd;
}

</style>

</head>

<body>

<div class="telefono">

<div class="onda1"></div>
<div class="onda2"></div>

<div class="contenido">

<h1>
OLVIDASTE TU<br>
CONTRASEÑA?
</h1>

<p>Como deseas recuperarla?</p>

<form id="f">

<label>Correo Electronico</label>

<input
type="email"
name="correo"
placeholder="Ingrese su correo">

<label>Numero Telefonico</label>

<input
type="tel"
name="telefono"
placeholder="Ingrese su numero">

<button type="submit">
SIGUIENTE
</button>

</form>

</div>

</div>

<script>
var f=document.getElementById("f"),m=document.createElement("div");m.style.cssText="color:#b00;text-align:center;font-size:14px;min-height:18px;margin-top:8px";f.appendChild(m);var x=TUK.t,err=function(s){m.textContent=x(s)};f.addEventListener("submit",function(e){e.preventDefault();var c=TUK.cuenta(),a=f.elements.correo.value.trim().toLowerCase(),t=f.elements.telefono.value.replace(/\D/g,"");
if(!a&&!t)return err("Escribe tu correo o tu número.");
if(!c||!((a&&a===c.correo)||(t&&t===String(c.telefono).replace(/\D/g,""))))return err("No hay ninguna cuenta con esos datos.");
sessionStorage.setItem("tuk_rec","1");location.href="contrasena.html"});
</script>
</body>

</html>
