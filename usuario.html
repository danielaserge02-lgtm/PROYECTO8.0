<!DOCTYPE html>
<html lang="es">

<head>
<script src="tuk.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

<title>Inicio Usuario</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
height:100dvh;
background:#52c6f4;
}

.telefono{
width:330px;
height:min(700px,96vh);
height:min(700px,96dvh);
background:#fff;
border-radius:30px;
position:relative;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.2);
display:flex;
flex-direction:column;
}

/* Mapa de fondo (se puede arrastrar) */

.mapa{
position:absolute;
inset:0;
background:#e8edf1;
overflow:hidden;
touch-action:none;
cursor:grab;
user-select:none;
-webkit-user-select:none;
}

.mapa.arrastrando{ cursor:grabbing; }

.lienzo{
position:absolute;
left:0;
top:0;
width:1100px;
height:776px;
will-change:transform;
}

.lienzo.suave{ transition:transform .4s ease; }

.lienzo img{
display:block;
width:100%;
height:100%;
pointer-events:none;
-webkit-user-drag:none;
}

.punto{
position:absolute;
left:412px;
top:372px;
width:16px;
height:16px;
background:#1a73e8;
border:3px solid #fff;
border-radius:50%;
box-shadow:0 0 0 18px rgba(26,115,232,.2);
}

/* Cabecera */

.cabecera{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 14px 10px;
background:#fff;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.logo{
font-size:34px;
font-weight:bold;
font-style:italic;
color:#0a4aa8;
letter-spacing:1px;
}

.derecha{ display:flex; align-items:center; gap:10px; }

.campana{ position:relative; font-size:20px; }

.campana::after{
content:"";
position:absolute;
top:0;
right:-2px;
width:8px;
height:8px;
background:#e23b3b;
border-radius:50%;
}

.avatar{
width:38px;
height:38px;
border-radius:50%;
background:#f3c9b8;
border:2px solid #d9d9d9;
display:grid;
place-items:center;
font-size:22px;
}

/* Botones flotantes del mapa */

.flotante{
position:absolute;
z-index:2;
padding:7px 9px;
border:none;
background:#fff;
font-size:9px;
font-weight:bold;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.2);
cursor:pointer;
}

.flotante .ico{ display:block; font-size:18px; margin-bottom:2px; }

.centro{ right:0; bottom:200px; border-radius:10px 0 0 10px; }

.espacio{ flex:1; }

/* Panel inferior */

.panel{
position:relative;
z-index:2;
margin:0 10px 8px;
display:grid;
gap:8px;
}

.accion{
width:100%;
display:flex;
align-items:center;
gap:12px;
padding:12px 14px;
border:none;
border-radius:14px;
background:#fff;
text-align:left;
box-shadow:0 4px 12px rgba(0,0,0,.15);
cursor:pointer;
transition:.3s;
}

.accion:hover{ background:#f1f8fc; }

.accion .icono{
flex:none;
width:30px;
height:30px;
display:grid;
place-items:center;
}

.accion .icono svg{ width:28px; height:28px; }

.accion .icono.sirena{
width:30px;
height:30px;
border-radius:50%;
background:#e23b3b;
font-size:15px;
}

.accion .texto{ flex:1; }
.accion b{ display:block; font-size:13px; color:#111; }
.accion small{ display:block; margin-top:3px; font-size:9px; color:#555; }
.accion .flecha{ flex:none; font-size:22px; color:#222; }

/* Menú inferior */

.menu{
position:relative;
z-index:2;
display:flex;
justify-content:space-around;
padding:8px 0 10px;
background:#fff;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.menu a{
position:relative;
display:flex;
flex-direction:column;
align-items:center;
gap:2px;
font-size:10px;
color:#555;
text-decoration:none;
}

.menu a .ico{ font-size:20px; }
.menu a.activo{ color:#1a73e8; font-weight:bold; }

.menu .badge{
position:absolute;
top:-4px;
right:-6px;
min-width:15px;
height:15px;
padding:0 4px;
border-radius:8px;
background:#e23b3b;
color:#fff;
font-size:9px;
display:grid;
place-items:center;
}

</style>

</head>

<body>

<div class="telefono">

<!-- Mapa -->
<div class="mapa" id="mapa">
<div class="lienzo" id="lienzo">
<img src="mapa.png" alt="Mapa" draggable="false">
<div class="punto"></div>
</div>
</div>

<!-- Cabecera -->
<div class="cabecera">
<div class="logo">TÜK</div>
<div class="derecha">
<span class="campana">🔔</span>
<div class="avatar">👩</div>
</div>
</div>

<button class="flotante centro" id="centro"><span class="ico">🎯</span>Centro</button>

<div class="espacio"></div>

<!-- Acciones -->
<div class="panel">

<button class="accion" id="buscar">
<span class="icono">
<svg viewBox="0 0 24 24" fill="none" stroke="#19a974" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
</span>
<span class="texto">
<b>Buscar carreras</b>
<small>Recibiendo solicitudes de servicio</small>
</span>
<span class="flecha">›</span>
</button>

<button class="accion" id="emergencia">
<span class="icono sirena">🚨</span>
<span class="texto">
<b>Botón de emergencia</b>
<small>Pulsa para enviar tu ubicación a contactos</small>
</span>
<span class="flecha">›</span>
</button>

</div>

<!-- Menú inferior -->
<nav class="menu">
<a href="usuario.html" class="activo"><span class="ico">🏠</span>Inicio</a>
<a href="comentarios.html"><span class="ico">⭐</span>Comentarios</a>
<a href="mensajes-usuario.html"><span class="ico">💬</span>Mensajes<span class="badge">3</span></a>
<a href="perfil-usuario.html"><span class="ico">👤</span>Perfil</a>
</nav>

</div>

<script>

/* ----- Mapa arrastrable ----- */

const mapa = document.getElementById("mapa");
const lienzo = document.getElementById("lienzo");

const LIENZO_W = 1100, LIENZO_H = 776;   // tamaño de la imagen del mapa
const PUNTO = { x: 420, y: 380 };        // tu ubicación dentro del mapa
let ANCHO = 330, ALTO = 700, K = 1;
let x = 0, y = 0, inicioX = 0, inicioY = 0, tocando = false;

function medir(){
  ANCHO = mapa.clientWidth;
  ALTO = mapa.clientHeight;
  K = Math.max(1, ANCHO / LIENZO_W, ALTO / LIENZO_H);
  lienzo.style.transformOrigin = "0 0";
}

function limitar(v, min, max){ return Math.min(max, Math.max(min, v)); }

function mover(nx, ny){
  x = limitar(nx, ANCHO - LIENZO_W * K, 0);
  y = limitar(ny, ALTO - LIENZO_H * K, 0);
  lienzo.style.transform = "translate(" + x + "px," + y + "px) scale(" + K + ")";
}

function centrar(suave){
  lienzo.classList.toggle("suave", !!suave);
  mover(ANCHO / 2 - PUNTO.x * K, ALTO / 2 - PUNTO.y * K);
}

mapa.addEventListener("pointerdown", function(e){
  tocando = true;
  lienzo.classList.remove("suave");
  mapa.classList.add("arrastrando");
  mapa.setPointerCapture(e.pointerId);
  inicioX = e.clientX - x;
  inicioY = e.clientY - y;
});

mapa.addEventListener("pointermove", function(e){
  if (!tocando) return;
  mover(e.clientX - inicioX, e.clientY - inicioY);
});

function soltar(){
  tocando = false;
  mapa.classList.remove("arrastrando");
}
mapa.addEventListener("pointerup", soltar);
mapa.addEventListener("pointercancel", soltar);

document.getElementById("centro").addEventListener("click", function(){ centrar(true); });
window.addEventListener("resize", function(){ medir(); mover(x, y); });

medir();
centrar(false);

/* ----- Botones ----- */

document.getElementById("buscar").addEventListener("click", function(){
  alert("Buscando carreras cercanas...");
});

document.getElementById("emergencia").addEventListener("click", function(){
  var c=TUK.cuenta()||{};alert(c.emerNombre?TUK.t("Tu ubicación fue enviada a")+" "+c.emerNombre+(c.emerTel?" ("+c.emerTel+")":"")+".":TUK.t("Aún no tienes contacto de emergencia. Agrégalo en Perfil > Emergencia y lugares."));
});

</script>

<script>
// Globo rojo del menú: conversaciones con mensajes sin leer
(function(){
  var n = 3;
  try {
    var c = JSON.parse(sessionStorage.getItem("tuk_chats_usuario"));
    if (c && c.length) n = c.filter(function(x){ return x.nuevos > 0; }).length;
  } catch(e){}
  document.querySelectorAll(".menu .badge").forEach(function(b){ if (n > 0) { b.textContent = n; } else { b.remove(); } });
  window.addEventListener("pageshow", function(e){ if (e.persisted) location.reload(); });
})();
</script>

</body>

</html>
