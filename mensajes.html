<!DOCTYPE html>
<html lang="es">

<head>
<script src="tuk.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

<title>Mensajes</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
height:100dvh;
background:#52c6f4;
}

.telefono{
width:330px;
height:min(700px,96vh);
height:min(700px,96dvh);
background:#f3f6f9;
border-radius:30px;
position:relative;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.2);
display:flex;
flex-direction:column;
}

/* Cabecera */

.cabecera{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 14px 10px;
background:#fff;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.hamburguesa{
border:none;
background:none;
font-size:24px;
cursor:pointer;
}

.logo{
font-size:34px;
font-weight:bold;
font-style:italic;
color:#0a4aa8;
letter-spacing:1px;
}

.derecha{ display:flex; align-items:center; gap:10px; }

.campana{ position:relative; font-size:20px; }

.campana::after{
content:"";
position:absolute;
top:0;
right:-2px;
width:8px;
height:8px;
background:#e23b3b;
border-radius:50%;
}

.avatar{
width:38px;
height:38px;
border-radius:50%;
background:#f7c531;
border:2px solid #0a4aa8;
display:grid;
place-items:center;
font-size:20px;
overflow:hidden;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

/* Contenido */

.scroll{
flex:1;
overflow-y:auto;
padding:12px;
scrollbar-width:none;
}

.scroll::-webkit-scrollbar{ display:none; }

h1{ font-size:22px; color:#0d2c54; }
.sub{ margin:2px 0 12px; font-size:10px; color:#555; }

.buscar{
display:flex;
align-items:center;
gap:8px;
padding:9px 12px;
margin-bottom:10px;
background:#fff;
border:1px solid #ddd;
border-radius:10px;
}

.buscar input{
flex:1;
border:none;
outline:none;
background:none;
font-size:12px;
}

.chips{
display:flex;
gap:6px;
margin-bottom:12px;
overflow-x:auto;
scrollbar-width:none;
}

.chips::-webkit-scrollbar{ display:none; }

.chip{
flex:none;
padding:7px 10px;
border:1px solid #ddd;
border-radius:14px;
background:#fff;
font-size:10px;
cursor:pointer;
white-space:nowrap;
}

.chip.activo{
background:#0a4aa8;
border-color:#0a4aa8;
color:#fff;
font-weight:bold;
}

/* Conversaciones */

.chat{
display:flex;
align-items:center;
gap:10px;
padding:10px;
margin-bottom:8px;
background:#fff;
border-radius:14px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
cursor:pointer;
transition:.3s;
}

.chat:hover{ background:#eef6fb; }

.foto{
position:relative;
flex:none;
width:44px;
height:44px;
border-radius:50%;
display:grid;
place-items:center;
font-size:24px;
background:#e3eef6;
}

.foto.morado{ background:#ece3fb; }
.foto.verde{ background:#dff5e6; }

.en-linea{
position:absolute;
left:0;
bottom:1px;
width:10px;
height:10px;
border-radius:50%;
background:#19b34a;
border:2px solid #fff;
}

.texto{ flex:1; min-width:0; }

.nombre{ font-size:13px; font-weight:bold; color:#111; }

.mensaje{
margin-top:4px;
font-size:10px;
color:#555;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.lado{
flex:none;
display:flex;
flex-direction:column;
align-items:flex-end;
gap:6px;
min-width:38px;
}

.hora{ font-size:9px; color:#777; }

.contador{
min-width:18px;
height:18px;
padding:0 5px;
border-radius:9px;
background:#1a73e8;
color:#fff;
font-size:10px;
font-weight:bold;
display:grid;
place-items:center;
}

.vacio{
margin-top:20px;
text-align:center;
font-size:12px;
color:#777;
}

/* Desvanece la lista detrás del botón flotante para que no tape textos */
.fade-fab{
position:absolute;
left:0;
right:0;
bottom:54px;
height:90px;
z-index:2;
pointer-events:none;
background:linear-gradient(to bottom, rgba(243,246,249,0), #f3f6f9 75%);
}

/* Botón nuevo mensaje */

.nuevo{
position:relative;
z-index:3;
flex:none;
align-self:flex-end;
margin:4px 14px 8px 0;
width:52px;
height:52px;
border:none;
border-radius:50%;
background:#1a73e8;
color:#fff;
font-size:8px;
line-height:1.1;
box-shadow:0 4px 12px rgba(26,115,232,.5);
cursor:pointer;
}

.nuevo span{ display:block; font-size:20px; }

/* Menú inferior */

.menu{
position:relative;
z-index:2;
display:flex;
justify-content:space-around;
padding:8px 0 10px;
background:#fff;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.menu a{
position:relative;
display:flex;
flex-direction:column;
align-items:center;
gap:2px;
font-size:10px;
color:#555;
text-decoration:none;
}

.menu a .ico{ font-size:20px; }
.menu a.activo{ color:#1a73e8; font-weight:bold; }

.menu .badge{
position:absolute;
top:-4px;
right:-2px;
min-width:15px;
height:15px;
padding:0 4px;
border-radius:8px;
background:#e23b3b;
color:#fff;
font-size:9px;
display:grid;
place-items:center;
}

</style>

</head>

<body>

<div class="telefono">

<div class="cabecera">
<button class="hamburguesa" aria-label="Menú">☰</button>
<div class="logo">TÜK</div>
<div class="derecha">
<span class="campana">🔔</span>
<div class="avatar">👤</div>
</div>
</div>

<div class="scroll">

<h1>Mensajes</h1>
<p class="sub">Comunícate con tus pasajeros y el equipo de soporte</p>

<div class="buscar">
<span>🔍</span>
<input type="text" id="buscador" placeholder="Buscar conversaciones">
</div>

<div class="chips" id="chips">
<button class="chip activo" data-f="todos">💬 Todos</button>
<button class="chip" data-f="pasajeros">👤 Pasajeros</button>
<button class="chip" data-f="soporte">🎧 Soporte</button>
<button class="chip" data-f="notificaciones">🔔 Notificaciones</button>
</div>

<div id="lista"></div>

</div>

<div class="fade-fab"></div>
<button class="nuevo" id="nuevo"><span>💬</span>Nuevo<br>mensaje</button>

<nav class="menu">
<a href="inicio-conductor.html"><span class="ico">🏠</span>Inicio</a>
<a href="historial.html"><span class="ico">📋</span>Historial</a>
<a href="mensajes.html" class="activo"><span class="ico">💬</span>Mensajes<span class="badge">3</span></a>
<a href="perfil.html"><span class="ico">👤</span>Perfil</a>
</nav>

</div>

<script>
// Conversaciones compartidas entre mensajes.html y chat.html
const CHATS_BASE = [
  { id:0, nombre:"María Fernanda", tipo:"pasajeros", icono:"👩", linea:true, nuevos:2, hora:"9:30 a.m.", msgs:[
    { de:"ellos", t:"Hola, ya estoy en la esquina de la calle 2", h:"9:12 a.m." },
    { de:"yo",    t:"Perfecto, voy llegando", h:"9:13 a.m." },
    { de:"ellos", t:"Gracias por el viaje, muy amable 😊", h:"9:30 a.m." } ] },
  { id:1, nombre:"Juan Camilo", tipo:"pasajeros", icono:"👨", linea:true, nuevos:1, hora:"8:45 a.m.", msgs:[
    { de:"ellos", t:"Buen día, necesito un servicio hacia el centro", h:"8:40 a.m." },
    { de:"yo",    t:"Claro, ¿en qué dirección estás?", h:"8:42 a.m." },
    { de:"ellos", t:"¿Puedes llegar en 5 minutos?", h:"8:45 a.m." } ] },
  { id:2, nombre:"Soporte TÜK", tipo:"soporte", icono:"🎧", color:"morado", nuevos:1, hora:"Ayer", msgs:[
    { de:"yo",    t:"Hola, quiero reportar un problema con un pasajero", h:"4:10 p.m." },
    { de:"ellos", t:"Tu reporte ha sido recibido y será revisado pronto.", h:"4:15 p.m." } ] },
  { id:3, nombre:"Laura Sofía", tipo:"pasajeros", icono:"👩‍🦱", linea:true, nuevos:0, hora:"Ayer", msgs:[
    { de:"ellos", t:"Hola, ¿ya vienes en camino?", h:"6:40 p.m." },
    { de:"yo",    t:"Sí, llego en 3 minutos", h:"6:41 p.m." },
    { de:"ellos", t:"Perfecto, estaré esperando en la esquina.", h:"6:42 p.m." } ] },
  { id:4, nombre:"TÜK", tipo:"notificaciones", icono:"📢", color:"verde", soloLectura:true, nuevos:0, hora:"10 may.", msgs:[
    { de:"ellos", t:"¡Bienvenido a TÜK! Gracias por ser parte de nuestra comunidad.", h:"9:00 a.m." },
    { de:"ellos", t:"Promoción del día: gana hasta 20% más en tus carreras. 🛺", h:"7:00 a.m." } ] },
  { id:5, nombre:"Andrés Felipe", tipo:"pasajeros", icono:"🧔", nuevos:0, hora:"10 may.", msgs:[
    { de:"yo",    t:"Llegamos, que tenga un buen día", h:"2:20 p.m." },
    { de:"ellos", t:"Listo, muchas gracias!", h:"2:21 p.m." } ] },
  { id:6, nombre:"Valentina R.", tipo:"pasajeros", icono:"👩‍🦰", linea:true, nuevos:0, hora:"10 may.", msgs:[
    { de:"yo",    t:"Gracias por viajar con TÜK", h:"11:05 a.m." },
    { de:"ellos", t:"Buen servicio, recomendado 👌", h:"11:07 a.m." } ] }
];

function cargarChats(){
  try { localStorage.removeItem("tuk_chats"); } catch(e){}   // limpia datos de versiones anteriores
  try {
    const g = JSON.parse(sessionStorage.getItem("tuk_chats"));
    if (g && g.length) return g;
  } catch(e){}
  return JSON.parse(JSON.stringify(CHATS_BASE));
}

function guardarChats(c){
  try { sessionStorage.setItem("tuk_chats", JSON.stringify(c)); } catch(e){}
}

function ultimoMsg(c){ return c.msgs[c.msgs.length - 1].t; }
</script>
<script>

const chats = cargarChats();
const lista = document.getElementById("lista");
const buscador = document.getElementById("buscador");
let filtro = "todos";

function pintar(){
  const texto = buscador.value.trim().toLowerCase();
  let html = "";

  chats.forEach(function(c){
    if (c.tipo === "notificaciones" && !TUK.cfg().promos) return;
    if (filtro !== "todos" && c.tipo !== filtro) return;
    if (texto && c.nombre.toLowerCase().indexOf(texto) === -1) return;

    html +=
      '<div class="chat" data-id="' + c.id + '">' +
        '<div class="foto ' + (c.color || "") + '">' + c.icono +
          (c.linea ? '<span class="en-linea"></span>' : '') +
        '</div>' +
        '<div class="texto">' +
          '<div class="nombre">' + c.nombre + '</div>' +
          '<div class="mensaje">' + (c.msgs[c.msgs.length - 1].de === "yo" ? "Tú: " : "") + ultimoMsg(c) + '</div>' +
        '</div>' +
        '<div class="lado">' +
          '<span class="hora">' + c.hora + '</span>' +
          (c.nuevos ? '<span class="contador">' + c.nuevos + '</span>' : '') +
        '</div>' +
      '</div>';
  });

  lista.innerHTML = html || '<p class="vacio">No se encontraron conversaciones.</p>';
}

lista.addEventListener("click", function(e){
  const tarjeta = e.target.closest(".chat");
  if (!tarjeta) return;
  window.location.href = "chat.html?id=" + tarjeta.dataset.id;
});

buscador.addEventListener("input", pintar);

document.querySelectorAll(".chip").forEach(function(chip){
  chip.addEventListener("click", function(){
    document.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("activo"); });
    chip.classList.add("activo");
    filtro = chip.dataset.f;
    pintar();
  });
});

document.getElementById("nuevo").addEventListener("click", function(){
  alert("Aquí podrás iniciar una conversación nueva.");
});

pintar();

</script>

<script>
// Aplica en todas las pantallas los datos guardados desde "Editar perfil"
(function(){
  let p = {};
  try { p = JSON.parse(localStorage.getItem("tuk_perfil") || "{}"); } catch(e){}
  if (p.foto) document.querySelectorAll(".avatar img, .foto-grande img").forEach(function(i){ i.src = p.foto; });
  if (p.nombre) document.querySelectorAll("[data-nombre]").forEach(function(e){ e.textContent = p.nombre; });
  if (p.descripcion) document.querySelectorAll("[data-descripcion]").forEach(function(e){ e.textContent = p.descripcion; });
})();
</script>

<script>
// Globo rojo del menú: cuántas conversaciones tienen mensajes sin leer
(function(){
  var n = 3;
  try {
    var c = JSON.parse(sessionStorage.getItem("tuk_chats"));
    if (c && c.length) n = c.filter(function(x){ return x.nuevos > 0; }).length;
  } catch(e){}
  document.querySelectorAll(".menu .badge").forEach(function(b){
    if (n > 0) { b.textContent = n; } else { b.remove(); }
  });
})();
</script>

</body>

</html>
