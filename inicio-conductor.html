<!DOCTYPE html>
<html lang="es">

<head>
<script src="tuk.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

<title>Inicio Conductor</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
height:100dvh;
background:#52c6f4;
}

.telefono{
width:330px;
height:min(700px,96vh);
height:min(700px,96dvh);
background:#fff;
border-radius:30px;
position:relative;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.2);
display:flex;
flex-direction:column;
}

/* Mapa de fondo */

.mapa{
position:absolute;
inset:0;
background:#e8edf1;
overflow:hidden;
cursor:grab;
touch-action:none;
user-select:none;
}

.mapa.arrastrando{ cursor:grabbing; }

.lienzo{
position:absolute;
left:0;
top:0;
width:1100px;
height:776px;
will-change:transform;
}

.lienzo.suave{ transition:transform .4s ease; }

.lienzo img{
display:block;
width:100%;
height:100%;
pointer-events:none;
-webkit-user-drag:none;
}

.punto{
position:absolute;
left:412px;
top:372px;
width:16px;
height:16px;
background:#1a73e8;
border:3px solid #fff;
border-radius:50%;
box-shadow:0 0 0 18px rgba(26,115,232,.2);
}

/* Capas de interfaz */

.cabecera{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 14px 10px;
margin-bottom:10px;
background:#fff;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.logo{
font-size:34px;
font-weight:bold;
font-style:italic;
color:#0a4aa8;
letter-spacing:1px;
}

.derecha{
display:flex;
align-items:center;
gap:10px;
}

.campana{
position:relative;
font-size:20px;
}

.campana::after{
content:"";
position:absolute;
top:0;
right:-2px;
width:8px;
height:8px;
background:#e23b3b;
border-radius:50%;
}

.avatar{
width:38px;
height:38px;
border-radius:50%;
background:#f7c531;
border:2px solid #0a4aa8;
display:grid;
place-items:center;
font-size:20px;
overflow:hidden;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.estado{
position:relative;
z-index:2;
margin:0 10px;
padding:10px 12px;
background:#fff;
border-radius:16px;
display:flex;
align-items:center;
gap:10px;
box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.ilustracion{
flex:none;
width:62px;
height:62px;
border-radius:14px;
background:#dff3fb;
display:grid;
place-items:center;
font-size:36px;
}

.estado .info{ flex:1; }

.estado .titulo{
display:flex;
align-items:center;
gap:6px;
font-size:16px;
font-weight:bold;
}

.estado .punto-estado{
width:9px;
height:9px;
border-radius:50%;
background:#19b34a;
}

.estado.off .punto-estado{ background:#999; }

.estado .sub{
margin-top:3px;
font-size:10px;
color:#666;
}

.switch{
flex:none;
width:50px;
height:28px;
border:none;
border-radius:14px;
background:#19b34a;
position:relative;
cursor:pointer;
transition:.3s;
}

.switch::after{
content:"";
position:absolute;
top:3px;
right:3px;
width:22px;
height:22px;
border-radius:50%;
background:#fff;
transition:.3s;
}

.estado.off .switch{ background:#bbb; }
.estado.off .switch::after{ right:25px; }

.flotante{
position:absolute;
z-index:2;
padding:6px 8px;
border:none;
border-radius:10px;
background:#fff;
font-size:9px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.2);
cursor:pointer;
}

.flotante .ico{ display:block; font-size:16px; }
.centro{ right:0; bottom:180px; border-radius:10px 0 0 10px; }

.espacio{ flex:1; }

/* Panel inferior */

.panel{
position:relative;
z-index:2;
margin:0 10px 8px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:6px;
padding:12px 10px;
background:#fff;
border-radius:16px;
box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.stat{ text-align:center; }

.stat .icono{
margin:0 auto 6px;
width:22px;
height:22px;
border-radius:50%;
display:grid;
place-items:center;
font-size:12px;
color:#fff;
}

.stat .etiqueta{ font-size:10px; color:#444; }
.stat .valor{ font-size:22px; font-weight:bold; margin-top:2px; }
.stat .valor.verde{ color:#19b34a; }

.menu{
position:relative;
z-index:2;
display:flex;
justify-content:space-around;
padding:8px 0 10px;
background:#fff;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.menu a{
position:relative;
display:flex;
flex-direction:column;
align-items:center;
gap:2px;
font-size:10px;
color:#555;
text-decoration:none;
}

.menu a .ico{ font-size:20px; }
.menu a.activo{ color:#1a73e8; font-weight:bold; }

.menu .badge{
position:absolute;
top:-4px;
right:-2px;
min-width:15px;
height:15px;
padding:0 4px;
border-radius:8px;
background:#e23b3b;
color:#fff;
font-size:9px;
display:grid;
place-items:center;
}

</style>

</head>

<body>

<div class="telefono">

<!-- Mapa -->
<div class="mapa">
<div class="lienzo" id="lienzo">
<img src="mapa.png" alt="Mapa" draggable="false">
<div class="punto"></div>
</div>
</div>

<!-- Cabecera -->
<div class="cabecera">
<div class="logo">TÜK</div>
<div class="derecha">
<span class="campana">🔔</span>
<div class="avatar">👤</div>
</div>
</div>

<!-- Estado en línea -->
<div class="estado" id="estado">
<div class="ilustracion">🛺</div>
<div class="info">
<div class="titulo"><span class="punto-estado"></span><span id="textoEstado">En línea</span></div>
<div class="sub" id="subEstado">Recibiendo solicitudes de servicio</div>
</div>
<button class="switch" id="switch" aria-label="Cambiar estado"></button>
</div>

<button class="flotante centro" id="centro"><span class="ico">🎯</span>Centro</button>

<div class="espacio"></div>

<!-- Panel inferior -->
<div class="panel">

<div class="stats">
<div class="stat">
<div class="icono" style="background:#19b34a;">$</div>
<div class="etiqueta">Ganancias hoy</div>
<div class="valor verde">$35.000</div>
</div>
<div class="stat">
<div class="icono" style="background:#1a73e8;">🏍</div>
<div class="etiqueta">Viajes realizados</div>
<div class="valor">6</div>
</div>
<div class="stat">
<div class="icono" style="background:#f7b500;">★</div>
<div class="etiqueta">Calificación</div>
<div class="valor">4.8 <span style="color:#f7b500;font-size:16px;">★</span></div>
</div>
</div>


</div>

<!-- Menú inferior -->
<nav class="menu">
<a href="#" class="activo"><span class="ico">🏠</span>Inicio</a>
<a href="historial.html"><span class="ico">📋</span>Historial</a>
<a href="mensajes.html"><span class="ico">💬</span>Mensajes<span class="badge">3</span></a>
<a href="perfil.html"><span class="ico">👤</span>Perfil</a>
</nav>

</div>

<script>

const estado = document.getElementById("estado");

function aplicarEstado(enLinea){
  estado.classList.toggle("off", !enLinea);
  document.getElementById("textoEstado").textContent = enLinea ? "En línea" : "Desconectado";
  document.getElementById("subEstado").textContent = enLinea
    ? "Recibiendo solicitudes de servicio"
    : "No recibirás solicitudes de servicio";
}

let enLinea = true;
try { enLinea = localStorage.getItem("tuk_enlinea") !== "0"; } catch(e){}
aplicarEstado(enLinea);

document.getElementById("switch").addEventListener("click", function(){
  enLinea = !enLinea;
  aplicarEstado(enLinea);
  try { localStorage.setItem("tuk_enlinea", enLinea ? "1" : "0"); } catch(e){}
});


// Mapa arrastrable
const mapa = document.querySelector(".mapa");
const lienzo = document.getElementById("lienzo");
const LIENZO_W = 1100, LIENZO_H = 776;  // tamaño de la imagen
let ANCHO = 330, ALTO = 700, K = 1;     // tamaño visible del mapa y zoom para cubrirlo

function medir(){
  ANCHO = mapa.clientWidth; ALTO = mapa.clientHeight;
  K = Math.max(1, ANCHO / LIENZO_W, ALTO / LIENZO_H);
  lienzo.style.transformOrigin = "0 0";
}
const PUNTO = { x: 420, y: 380 };       // tu ubicación dentro del mapa

let x = 0, y = 0, inicioX, inicioY, baseX, baseY, moviendo = false;

function limitar(v, min, max){ return Math.min(max, Math.max(min, v)); }

function mover(nx, ny){
  x = limitar(nx, ANCHO - LIENZO_W * K, 0);
  y = limitar(ny, ALTO - LIENZO_H * K, 0);
  lienzo.style.transform = "translate(" + x + "px," + y + "px) scale(" + K + ")";
}

function centrar(suave){
  lienzo.classList.toggle("suave", !!suave);
  mover(ANCHO / 2 - PUNTO.x * K, ALTO / 2 - PUNTO.y * K);
}

mapa.addEventListener("pointerdown", function(e){
  moviendo = true;
  inicioX = e.clientX; inicioY = e.clientY;
  baseX = x; baseY = y;
  lienzo.classList.remove("suave");
  mapa.classList.add("arrastrando");
  mapa.setPointerCapture(e.pointerId);
});

mapa.addEventListener("pointermove", function(e){
  if (!moviendo) return;
  mover(baseX + e.clientX - inicioX, baseY + e.clientY - inicioY);
});

function soltar(){
  moviendo = false;
  mapa.classList.remove("arrastrando");
}
mapa.addEventListener("pointerup", soltar);
mapa.addEventListener("pointercancel", soltar);

document.getElementById("centro").addEventListener("click", function(){
  centrar(true);
});

window.addEventListener("resize", function(){ medir(); mover(x, y); });

medir();
centrar(false);

</script>

<script>
// Aplica en todas las pantallas los datos guardados desde "Editar perfil"
(function(){
  let p = {};
  try { p = JSON.parse(localStorage.getItem("tuk_perfil") || "{}"); } catch(e){}
  if (p.foto) document.querySelectorAll(".avatar img, .foto-grande img").forEach(function(i){ i.src = p.foto; });
  if (p.nombre) document.querySelectorAll("[data-nombre]").forEach(function(e){ e.textContent = p.nombre; });
  if (p.descripcion) document.querySelectorAll("[data-descripcion]").forEach(function(e){ e.textContent = p.descripcion; });
})();
</script>

<script>
// Globo rojo del menú: cuántas conversaciones tienen mensajes sin leer
(function(){
  var n = 3;
  try {
    var c = JSON.parse(sessionStorage.getItem("tuk_chats"));
    if (c && c.length) n = c.filter(function(x){ return x.nuevos > 0; }).length;
  } catch(e){}
  document.querySelectorAll(".menu .badge").forEach(function(b){
    if (n > 0) { b.textContent = n; } else { b.remove(); }
  });
})();
</script>

</body>

</html>
