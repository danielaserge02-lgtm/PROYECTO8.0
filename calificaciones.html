<!DOCTYPE html>
<html lang="es">
<head>
<script src="tuk.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Calificaciones</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{display:flex;justify-content:center;align-items:center;height:100vh;
height:100dvh;background:#52c6f4;}
.telefono{width:330px;height:min(700px,96vh);
height:min(700px,96dvh);background:#f3f6f9;border-radius:30px;position:relative;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.2);display:flex;flex-direction:column;}

.cabecera{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:14px 14px 10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.atras{border:none;background:none;font-size:32px;line-height:1;color:#0a4aa8;cursor:pointer;padding:0 6px 4px 0;text-decoration:none;}
.titulo-pag{flex:1;font-size:18px;font-weight:bold;color:#0d2c54;}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:#f7c531;border:2px solid #0a4aa8;display:grid;place-items:center;font-size:20px;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}

.scroll{flex:1;overflow-y:auto;padding:12px;scrollbar-width:none;}
.scroll::-webkit-scrollbar{display:none;}
.tarjeta{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:10px;padding:12px;}
.tarjeta h3{font-size:13px;color:#0d2c54;margin-bottom:10px;}

.menu{position:relative;z-index:2;display:flex;justify-content:space-around;padding:8px 0 10px;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.1);}
.menu a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#555;text-decoration:none;}
.menu a .ico{font-size:20px;}
.menu a.activo{color:#1a73e8;font-weight:bold;}
.menu .badge{position:absolute;top:-4px;right:-2px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#e23b3b;color:#fff;font-size:9px;display:grid;place-items:center;}
</style>
<style>
.resumen{ display:flex; align-items:center; gap:14px; }
.promedio{ text-align:center; flex:none; }
.promedio .num{ font-size:38px; font-weight:bold; color:#0d2c54; line-height:1; }
.promedio .estrellas{ color:#f7b500; font-size:13px; margin:4px 0 2px; letter-spacing:1px; }
.promedio small{ font-size:9px; color:#555; }

.barras{ flex:1; }
.barra-fila{ display:flex; align-items:center; gap:6px; margin-bottom:5px; font-size:9px; color:#555; }
.barra-fila .pista{ flex:1; height:6px; border-radius:3px; background:#e8e8e8; overflow:hidden; }
.barra-fila .relleno{ height:100%; background:#f7b500; }
.barra-fila .n{ width:16px; text-align:right; }

.comentario{ padding:10px 0; }
.comentario + .comentario{ border-top:1px solid #f0f0f0; }
.com-cab{ display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.com-cab .foto{ width:30px; height:30px; border-radius:50%; background:#e3eef6; display:grid; place-items:center; font-size:16px; }
.com-cab b{ flex:1; font-size:12px; color:#111; }
.com-cab .est{ color:#f7b500; font-size:10px; }
.comentario p{ font-size:11px; color:#444; line-height:1.35; }
.comentario small{ display:block; margin-top:4px; font-size:9px; color:#888; }
</style>
</head>
<body>

<div class="telefono">

<div class="cabecera">
<a class="atras" href="perfil.html" aria-label="Volver">‹</a>
<div class="titulo-pag">Calificaciones</div>
<div class="avatar">👤</div>
</div>

<div class="scroll">

<div class="tarjeta resumen">
<div class="promedio">
<div class="num">4.8</div>
<div class="estrellas">★★★★★</div>
<small>58 calificaciones</small>
</div>
<div class="barras" id="barras"></div>
</div>

<div class="tarjeta">
<h3>Comentarios de pasajeros</h3>
<div id="comentarios"></div>
</div>

</div>

<nav class="menu">
<a href="inicio-conductor.html"><span class="ico">🏠</span>Inicio</a>
<a href="historial.html"><span class="ico">📋</span>Historial</a>
<a href="mensajes.html"><span class="ico">💬</span>Mensajes<span class="badge">3</span></a>
<a href="perfil.html" class="activo"><span class="ico">👤</span>Perfil</a>
</nav>

</div>

<script>

const reparto = { 5:49, 4:8, 3:1, 2:0, 1:0 };      // suma 58 calificaciones

const comentarios = [
  { n:"María Fernanda", i:"👩",    e:5, t:"Muy amable y puntual, excelente servicio.",          f:"12 de may, 2024" },
  { n:"Juan Camilo",    i:"👨",    e:5, t:"Llegó rápido y conduce con mucho cuidado.",          f:"12 de may, 2024" },
  { n:"Laura Sofía",    i:"👩‍🦱", e:5, t:"Muy buen trato, lo recomiendo.",                     f:"11 de may, 2024" },
  { n:"Andrés Felipe",  i:"🧔",    e:4, t:"Buen viaje, solo se demoró un poco en llegar.",      f:"10 de may, 2024" },
  { n:"Valentina R.",   i:"👩‍🦰", e:5, t:"Buen servicio, recomendado 👌",                     f:"10 de may, 2024" }
];

document.getElementById("barras").innerHTML = [5,4,3,2,1].map(function(s){
  return '<div class="barra-fila"><span>' + s + '★</span>' +
    '<div class="pista"><div class="relleno" style="width:' + Math.round(reparto[s] / 58 * 100) + '%;"></div></div>' +
    '<span class="n">' + reparto[s] + '</span></div>';
}).join("");

document.getElementById("comentarios").innerHTML = comentarios.map(function(c){
  return '<div class="comentario"><div class="com-cab"><span class="foto">' + c.i + '</span><b>' + c.n + '</b>' +
    '<span class="est">' + "★".repeat(c.e) + "☆".repeat(5 - c.e) + '</span></div>' +
    '<p>' + c.t + '</p><small>' + c.f + '</small></div>';
}).join("");

</script>

<script>
// Aplica en todas las pantallas los datos guardados desde "Editar perfil"
(function(){
  let p = {};
  try { p = JSON.parse(localStorage.getItem("tuk_perfil") || "{}"); } catch(e){}
  if (p.foto) document.querySelectorAll(".avatar img, .foto-grande img").forEach(function(i){ i.src = p.foto; });
  if (p.nombre) document.querySelectorAll("[data-nombre]").forEach(function(e){ e.textContent = p.nombre; });
  if (p.descripcion) document.querySelectorAll("[data-descripcion]").forEach(function(e){ e.textContent = p.descripcion; });
})();
</script>

<script>
// Globo rojo del menú: cuántas conversaciones tienen mensajes sin leer
(function(){
  var n = 3;
  try {
    var c = JSON.parse(sessionStorage.getItem("tuk_chats"));
    if (c && c.length) n = c.filter(function(x){ return x.nuevos > 0; }).length;
  } catch(e){}
  document.querySelectorAll(".menu .badge").forEach(function(b){
    if (n > 0) { b.textContent = n; } else { b.remove(); }
  });
})();
</script>

</body>
</html>
